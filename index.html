<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16A34A" />
    
    <!-- Primary Meta Tags -->
    <title>Luggage Deposit Rome - Storage near Roma Termini</title>
    <meta name="description" content="Secure luggage storage room just 2 minutes from Roma Termini. Book online, open every day from 08:30 to 22:00. Safe and CCTV monitored." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://cdn.shopify.com/s/files/1/0753/8144/0861/files/cropped-Untitled-design-2025-09-11T094640.576_1.png?v=1765462614&width=160&format=webp">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopify.com">
    <link rel="preconnect" href="https://aistudiocdn.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://cdn.shopify.com">
    
    <!-- Preload LCP Image with High Priority -->
    <link rel="preload" as="image" href="/luggage storage rome.png" fetchpriority="high">
    
    <!-- Optimized Font Loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    </noscript>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#16a34a', // Green
                hover: '#15803d',
                light: '#ecfdf5',
              },
              dark: '#0f172a',
            }
          }
        }
      }
    </script>
    <style>
      /* Critical CSS for above-the-fold content */
      body {
        font-family: 'Inter', 'sans-serif';
        font-display: swap;
        margin: 0;
        background: #fff;
      }
      html {
        scroll-behavior: smooth;
      }
      .skeleton-hero {
        padding-top: 6rem;
        padding-bottom: 4rem;
        max-width: 80rem;
        margin: 0 auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .skeleton-title {
        height: 3rem;
        background: #f1f5f9;
        border-radius: 0.5rem;
        width: 80%;
        margin-bottom: 1.5rem;
      }
      .skeleton-text {
        height: 1.25rem;
        background: #f1f5f9;
        border-radius: 0.25rem;
        width: 60%;
        margin-bottom: 1rem;
      }
      .skeleton-btn {
        height: 3.5rem;
        background: #f1f5f9;
        border-radius: 0.75rem;
        width: 12rem;
        display: inline-block;
        margin-right: 1rem;
      }
      @media (min-width: 1024px) {
        .skeleton-hero {
          padding-top: 8rem;
          padding-bottom: 6rem;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 3rem;
        }
      }
      
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-helmet-async": "https://aistudiocdn.com/react-helmet-async@^2.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <!-- Lightweight Loading State to prevent blank screen -->
      <div class="skeleton-hero">
        <div>
          <div class="skeleton-title"></div>
          <div class="skeleton-text"></div>
          <div class="skeleton-text"></div>
          <div class="skeleton-btn"></div>
          <div class="skeleton-btn"></div>
        </div>
        <div class="hidden lg:block">
          <div style="height: 400px; background: #f1f5f9; border-radius: 1.5rem;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
