<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16A34A" />
    
    <!-- Primary Meta Tags -->
    <title>Luggage Deposit Rome - Storage near Roma Termini</title>
    <meta name="description" content="Secure luggage storage room just 2 minutes from Roma Termini. Book online, open every day from 08:30 to 22:00. Safe and CCTV monitored." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://cdn.shopify.com/s/files/1/0753/8144/0861/files/cropped-Untitled-design-2025-09-11T094640.576_1.png?v=1765462614&width=160&format=webp">
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://aistudiocdn.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Preload LCP Image with High Priority -->
    <link rel="preload" as="image" href="/luggage storage rome.png" fetchpriority="high">
    
    <!-- Preload Logo -->
    <link rel="preload" as="image" href="https://cdn.shopify.com/s/files/1/0753/8144/0861/files/cropped-Untitled-design-2025-09-11T094640.576_1.png?v=1765462614&width=160&format=webp" fetchpriority="high">
    
    <!-- Optimized Font Loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" media="all">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography" defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#16a34a', // Green
                hover: '#15803d',
                light: '#ecfdf5',
              },
              dark: '#0f172a',
            }
          }
        }
      }
    </script>
    <style>
      /* Critical CSS for above-the-fold content */
      :root {
        --primary: #16a34a;
        --dark: #0f172a;
        --gray-100: #f1f5f9;
        --gray-400: #94a3b8;
        --gray-600: #475569;
      }
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-display: swap;
        margin: 0;
        background: #fff;
        color: var(--dark);
        -webkit-font-smoothing: antialiased;
      }
      .skeleton-hero {
        padding-top: 6rem;
        padding-bottom: 4rem;
        max-width: 80rem;
        margin: 0 auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        display: flex;
        flex-direction: column;
      }
      .skeleton-badge {
        width: 140px;
        height: 28px;
        background: #ecfdf5;
        border-radius: 9999px;
        margin-bottom: 1.5rem;
      }
      .skeleton-title {
        height: 4rem;
        background: var(--gray-100);
        border-radius: 0.75rem;
        width: 90%;
        margin-bottom: 1.5rem;
      }
      .skeleton-text {
        height: 1.25rem;
        background: var(--gray-100);
        border-radius: 0.375rem;
        width: 75%;
        margin-bottom: 1rem;
      }
      .skeleton-btns {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
      }
      .skeleton-btn {
        height: 3.5rem;
        background: var(--gray-100);
        border-radius: 0.75rem;
        width: 180px;
      }
      .skeleton-img {
        height: 450px;
        background: var(--gray-100);
        border-radius: 2rem;
        margin-top: 3rem;
        width: 100%;
      }
      @media (min-width: 1024px) {
        .skeleton-hero {
          padding-top: 8rem;
          padding-bottom: 6rem;
          flex-direction: row;
          align-items: center;
          gap: 5rem;
        }
        .skeleton-hero > div:first-child {
          flex: 1.2;
        }
        .skeleton-img {
          flex: 0.8;
          margin-top: 0;
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .6; }
      }
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      /* Navbar placeholder */
      .nav-placeholder {
        height: 80px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        padding: 0 1.5rem;
        max-width: 80rem;
        margin: 0 auto;
      }
      .nav-logo {
        width: 150px;
        height: 40px;
        background: var(--gray-100);
        border-radius: 0.5rem;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-helmet-async": "https://aistudiocdn.com/react-helmet-async@^2.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <!-- Lightweight Loading State to prevent blank screen -->
      <div class="nav-placeholder">
        <div class="nav-logo animate-pulse"></div>
      </div>
      <div class="skeleton-hero">
        <div>
          <div class="skeleton-badge animate-pulse"></div>
          <div class="skeleton-title animate-pulse"></div>
          <div class="skeleton-text animate-pulse"></div>
          <div class="skeleton-text animate-pulse"></div>
          <div class="skeleton-btns">
            <div class="skeleton-btn animate-pulse"></div>
            <div class="skeleton-btn animate-pulse"></div>
          </div>
        </div>
        <div class="skeleton-img animate-pulse"></div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
